<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify Callback</title>
</head>
<body>
  <h1>Spotify Callback</h1>
  <p>Verbinde…</p>

<script>
const clientId = "1567cc8cfec14ea2b8562efca5dd7e08";
const redirectUri = "https://skarvaan.github.io/family-music-quiz/callback.html";

const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const error = params.get("error");

async function exchangeToken(){
  const verifier = localStorage.getItem("pkce_verifier");
  if(!verifier){
    document.body.innerHTML += "<pre>❌ Kein PKCE Verifier gefunden (bitte nochmal Login starten).</pre>";
    return;
  }

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: redirectUri,
    code_verifier: verifier
  });

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body
  });

  const data = await response.json();

  if(data.access_token){
    localStorage.setItem("spotify_access_token", data.access_token);
    localStorage.setItem("spotify_scope", data.scope || "");
    document.body.innerHTML += "<pre>✅ Token gespeichert. Zurück…</pre>";
    setTimeout(()=>{ window.location.href = "./"; }, 900);
  } else {
    document.body.innerHTML += "<pre>❌ Token Fehler:\n" + JSON.stringify(data, null, 2) + "</pre>";
  }
}

if(error){
  document.body.innerHTML += "<pre>❌ Fehler: " + error + "</pre>";
} else if(code){
  exchangeToken();
} else {
  document.body.innerHTML += "<pre>❌ Kein Code erhalten.</pre>";
}
</script>
</body>
</html>
