<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Music Quiz · Player</title>
  <link rel="stylesheet" href="/family-music-quiz/styles.css" />
</head>
<body class="player-body">
  <main class="player-shell">
    <section class="player-card-mobile">
      <div id="joinedName" class="joined-name" hidden></div>
      <div class="eyebrow player-brand">Family Music Quiz</div>
      <h1 class="player-title">Family Music Quiz</h1>

      <form id="joinForm" class="player-form">
        <label>Raumcode
          <input id="roomCodeInput" maxlength="6" autocomplete="off" autocapitalize="none" placeholder="z.B. abc123" />
        </label>
        <label>Dein Name
          <input id="playerNameInput" autocomplete="name" placeholder="z.B. Anna" required />
        </label>
        <button class="action-button primary" type="submit">Beitreten</button>
      </form>

      <section id="playerStatus" class="player-status-panel muted">Raumcode und Namen eingeben.</section>
      <section id="promptPanel" class="player-prompt-panel"></section>
      <section id="controlPanel" class="player-control-panel" hidden></section>
      <section id="activePanel" class="player-active-panel" hidden>
        <label class="playerSwitchRow"><span>Ich spiele aktiv mit</span><input id="activeToggle" type="checkbox" checked></label>
      </section>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/public/player.js"></script>
</body>
</html>
